<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Transformations IBDP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        // --- INLINE SVG ICONS ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const ChevronRight = (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>;
        const CheckCircle2 = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>;
        const XCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7c0 3.31 2.69 6 6 6s6-2.69 6-6V2Z"/></IconBase>;
        const Activity = (p) => <IconBase {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>;
        const ArrowRight = (p) => <IconBase {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const RotateCcw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;

        // --- MATH & FUNCTION DEFINITIONS ---
        const FUNCTIONS = {
            quadratic: {
                label: 'Quadratic: f(x) = x²',
                eval: (x) => x * x,
                str: 'x²',
                points: [{ x: -2, y: 4, label: 'A' }, { x: 0, y: 0, label: 'B' }, { x: 2, y: 4, label: 'C' }]
            },
            cubic: {
                label: 'Cubic: f(x) = x³',
                eval: (x) => x * x * x,
                str: 'x³',
                points: [{ x: -1, y: -1, label: 'A' }, { x: 0, y: 0, label: 'B' }, { x: 1, y: 1, label: 'C' }]
            },
            absolute: {
                label: 'Absolute Value: f(x) = |x|',
                eval: (x) => Math.abs(x),
                str: '|x|',
                points: [{ x: -3, y: 3, label: 'A' }, { x: 0, y: 0, label: 'B' }, { x: 3, y: 3, label: 'C' }]
            },
            sine: {
                label: 'Sine: f(x) = sin(x)',
                eval: (x) => Math.sin(x),
                str: 'sin(x)',
                points: [{ x: -Math.PI / 2, y: -1, label: 'A' }, { x: 0, y: 0, label: 'B' }, { x: Math.PI / 2, y: 1, label: 'C' }]
            },
            exponential: {
                label: 'Exponential: f(x) = 2ˣ',
                eval: (x) => Math.pow(2, x),
                str: '2ˣ',
                points: [{ x: -1, y: 0.5, label: 'A' }, { x: 0, y: 1, label: 'B' }, { x: 1, y: 2, label: 'C' }]
            }
        };

        // --- QUIZ QUESTION GENERATOR ---
        // Generates 3 abstract f(x) questions (qIndex 0..2) and 2 specific function questions (qIndex 3..4)
        const generateQuestion = (topic, level, qIndex = 0) => {
            const isSpecific = (qIndex % 5) >= 3;
            const rInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const rNonZero = (min, max) => { let v = 0; while (v === 0) v = rInt(min, max); return v; };
            const shuffle = (array) => {
                let arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            };

            let q, correct, exp, options;

            if (topic === 'translation') {
                if (!isSpecific) {
                    // ABSTRACT QUESTIONS
                    if (level === 1) {
                        const isVert = Math.random() > 0.5;
                        const shift = rNonZero(-5, 5);
                        if (isVert) {
                            q = `If the function y = f(x) is translated vertically by ${shift} units, what is the equation of the transformed function?`;
                            correct = `y = f(x) ${shift > 0 ? '+' : '-'} ${Math.abs(shift)}`;
                            options = [correct, `y = f(x ${shift > 0 ? '+' : '-'} ${Math.abs(shift)})`, `y = f(x) ${shift > 0 ? '-' : '+'} ${Math.abs(shift)}`, `y = f(x ${shift > 0 ? '-' : '+'} ${Math.abs(shift)})`];
                            exp = `A vertical translation shifts the graph up or down, affecting y-values directly. The transformation rule is f(x) + d. Here d = ${shift}, giving ${correct}.`;
                        } else {
                            q = `If the function y = f(x) is translated horizontally by ${shift} units, what is the equation of the transformed function?`;
                            correct = `y = f(x ${shift > 0 ? '-' : '+'} ${Math.abs(shift)})`;
                            options = [correct, `y = f(x ${shift > 0 ? '+' : '-'} ${Math.abs(shift)})`, `y = f(x) ${shift > 0 ? '+' : '-'} ${Math.abs(shift)}`, `y = f(x) ${shift > 0 ? '-' : '+'} ${Math.abs(shift)}`];
                            exp = `A horizontal translation affects x-values inside the bracket. Translating by vector (${shift}, 0) yields f(x - c). For c = ${shift}, this gives ${correct}.`;
                        }
                    } else if (level === 2) {
                        const c = rNonZero(-4, 4);
                        const d = rNonZero(-4, 4);
                        q = `The point A(2, -3) lies on the graph of y = f(x). Find the coordinates of its image on the graph of y = f(x - ${c}) ${d > 0 ? '+' : '-'} ${Math.abs(d)}.`;
                        correct = `(${2 + c}, ${-3 + d})`;
                        options = [correct, `(${2 - c}, ${-3 + d})`, `(${2 + c}, ${-3 - d})`, `(${2 - c}, ${-3 - d})`];
                        exp = `The transformation y = f(x - c) + d translates points by vector (${c}, ${d}). Mapping (2, -3) -> (2 + ${c}, -3 + ${d}) gives ${correct}.`;
                    } else {
                        const c = rNonZero(-5, 5);
                        const d = rNonZero(-5, 5);
                        q = `If g(x) = f(x - ${c}) ${d > 0 ? '+' : '-'} ${Math.abs(d)}, which column vector represents the translation that maps f(x) onto g(x)?`;
                        correct = `(${c}, ${d})`;
                        options = [correct, `(${-c}, ${d})`, `(${c}, ${-d})`, `(${-c}, ${-d})`];
                        exp = `In IBDP notation, a transformation of the form y = f(x - h) + k represents a translation vector (h, k). Here, h = ${c} and k = ${d}.`;
                    }
                } else {
                    // SPECIFIC FUNCTION QUESTIONS
                    if (level === 1) {
                        const fnType = Math.random() > 0.5 ? 'quad' : 'trig';
                        if (fnType === 'quad') {
                            const c = rNonZero(-4, 4);
                            const d = rNonZero(-4, 4);
                            q = `Which vector translates y = x² onto y = (x ${c > 0 ? '-' : '+'} ${Math.abs(c)})² ${d > 0 ? '+' : '-'} ${Math.abs(d)}?`;
                            correct = `(${c}, ${d})`;
                            options = [correct, `(${-c}, ${d})`, `(${c}, ${-d})`, `(${-c}, ${-d})`];
                            exp = `The vertex form y = (x - h)² + k represents a translation of y = x² by vector (h, k) = (${c}, ${d}).`;
                        } else {
                            const d = rNonZero(-4, 4);
                            q = `Describe the translation mapping y = sin(x) onto y = sin(x + 2) ${d > 0 ? '+' : '-'} ${Math.abs(d)}.`;
                            correct = `Translation by vector (-2, ${d})`;
                            options = [
                                correct,
                                `Translation by vector (2, ${d})`,
                                `Translation by vector (-2, ${-d})`,
                                `Translation by vector (2, ${-d})`
                            ];
                            exp = `sin(x + 2) represents a horizontal shift 2 units left (vector component -2). The constant ${d} shifts vertically by ${d}. Thus the vector is (-2, ${d}).`;
                        }
                    } else if (level === 2) {
                        const fnType = Math.random() > 0.5 ? 'exp' : 'vertex';
                        if (fnType === 'exp') {
                            const d = rNonZero(-4, 4);
                            q = `The horizontal asymptote of y = eˣ is y = 0. What is the equation of the horizontal asymptote of y = e^(x - 2) ${d > 0 ? '+' : '-'} ${Math.abs(d)}?`;
                            correct = `y = ${d}`;
                            options = [`y = ${d}`, `y = ${-d}`, `y = ${d > 0 ? d + 1 : d - 1}`, `y = ${d > 0 ? -(d + 1) : -(d - 1)}`];
                            exp = `Horizontal translation e^(x - 2) does not change the horizontal asymptote y = 0. The vertical shift of ${d} units moves the asymptote to y = ${d}.`;
                        } else {
                            const c = rNonZero(-4, 4);
                            const d = rNonZero(-4, 4);
                            q = `The vertex of y = x² is at (0, 0). Find the vertex of y = (x ${c > 0 ? '-' : '+'} ${Math.abs(c)})² ${d > 0 ? '+' : '-'} ${Math.abs(d)}.`;
                            correct = `(${c}, ${d})`;
                            options = [`(${c}, ${d})`, `(${-c}, ${d})`, `(${c}, ${-d})`, `(${-c}, ${-d})`];
                            exp = `The vertex form y = (x - h)² + k has vertex (h, k). For y = (x - (${c}))² + (${d}), the vertex is (${c}, ${d}).`;
                        }
                    } else {
                        const c = rNonZero(-3, 3);
                        const d = rNonZero(-3, 3);
                        q = `The minimum point of f(x) = |x| + 1 is (0, 1). After translating by vector (${c}, ${d}), what is the equation of the transformed function g(x)?`;
                        correct = `g(x) = |x ${c > 0 ? '-' : '+'} ${Math.abs(c)}| ${1 + d >= 0 ? '+' : '-'} ${Math.abs(1 + d)}`;
                        options = [
                            correct,
                            `g(x) = |x ${c > 0 ? '+' : '-'} ${Math.abs(c)}| ${1 + d >= 0 ? '+' : '-'} ${Math.abs(1 + d)}`,
                            `g(x) = |x ${c > 0 ? '-' : '+'} ${Math.abs(c)}| ${1 - d >= 0 ? '+' : '-'} ${Math.abs(1 - d)}`,
                            `g(x) = |x ${c > 0 ? '+' : '-'} ${Math.abs(c)}| ${d >= 0 ? '+' : '-'} ${Math.abs(d)}`
                        ];
                        exp = `Translating by vector (${c}, ${d}) replaces x with (x - ${c}) and adds ${d} to the function output. So g(x) = |x - ${c}| + 1 + ${d} = ${correct}.`;
                    }
                }
            } else if (topic === 'reflection') {
                if (!isSpecific) {
                    if (level === 1) {
                        const isX = Math.random() > 0.5;
                        q = `Which equation represents y = f(x) reflected in the ${isX ? 'x-axis' : 'y-axis'}?`;
                        correct = isX ? `y = -f(x)` : `y = f(-x)`;
                        options = [correct, isX ? `y = f(-x)` : `y = -f(x)`, `y = f(x) - 1`, `y = -f(-x)`];
                        exp = isX ? `Reflecting in the x-axis negates y-values: y = -f(x).` : `Reflecting in the y-axis negates x-values before evaluation: y = f(-x).`;
                    } else if (level === 2) {
                        const isX = Math.random() > 0.5;
                        const px = rNonZero(-5, 5);
                        const py = rNonZero(-5, 5);
                        q = `The point P(${px}, ${py}) lies on y = f(x). What are the coordinates of P' after reflection in the ${isX ? 'x-axis' : 'y-axis'}?`;
                        correct = isX ? `(${px}, ${-py})` : `(${-px}, ${py})`;
                        options = [correct, `(${-px}, ${-py})`, `(${px}, ${py})`, isX ? `(${-px}, ${py})` : `(${px}, ${-py})`];
                        exp = isX ? `A reflection in the x-axis maps (x, y) to (x, -y). Thus P' = (${px}, ${-py}).` : `A reflection in the y-axis maps (x, y) to (-x, y). Thus P' = (${-px}, ${py}).`;
                    } else {
                        q = `If f(x) is an odd function, which statement is true regarding its reflections?`;
                        correct = `A reflection in the x-axis produces the exact same graph as a reflection in the y-axis.`;
                        options = [
                            correct,
                            `A reflection in the x-axis leaves the function completely unchanged.`,
                            `A reflection in the y-axis leaves the function completely unchanged.`,
                            `It cannot be reflected.`
                        ];
                        exp = `By definition, an odd function satisfies f(-x) = -f(x). This means a horizontal reflection f(-x) is mathematically identical to a vertical reflection -f(x).`;
                    }
                } else {
                    // SPECIFIC REFLECTION QUESTIONS
                    if (level === 1) {
                        const isX = Math.random() > 0.5;
                        if (isX) {
                            q = `Which equation represents y = x³ reflected across the x-axis?`;
                            correct = `y = -x³`;
                            options = [`y = -x³`, `y = (-x)³`, `y = x³ - 1`, `y = 1/x³`];
                            exp = `Reflecting in the x-axis negates the entire output: y = -(x³) = -x³.`;
                        } else {
                            q = `Which equation represents y = 2ˣ reflected across the y-axis?`;
                            correct = `y = 2⁻ˣ`;
                            options = [`y = 2⁻ˣ`, `y = -2ˣ`, `y = -(2⁻ˣ)`, `y = 2ˣ - 1`];
                            exp = `Reflecting in the y-axis replaces x with -x inside the function: y = 2⁻ˣ (which equals (1/2)ˣ).`;
                        }
                    } else if (level === 2) {
                        q = `The point (3, 9) lies on y = x². What is its image on y = -x² after reflection in the x-axis?`;
                        correct = `(3, -9)`;
                        options = [`(3, -9)`, `(-3, 9)`, `(-3, -9)`, `(9, 3)`];
                        exp = `Reflection in the x-axis negates y-coordinates: (x, y) -> (x, -y). So (3, 9) maps to (3, -9).`;
                    } else {
                        q = `If y = (x - 2)² is reflected in the y-axis, what is the expanded form of the new function?`;
                        correct = `y = x² + 4x + 4`;
                        options = [`y = x² + 4x + 4`, `y = x² - 4x + 4`, `y = -x² + 4x - 4`, `y = -x² - 4x - 4`];
                        exp = `Reflecting in the y-axis replaces x with -x: y = (-x - 2)² = (-(x + 2))² = (x + 2)² = x² + 4x + 4.`;
                    }
                }
            } else if (topic === 'dilation') {
                if (!isSpecific) {
                    if (level === 1) {
                        const isVert = Math.random() > 0.5;
                        const factor = rInt(2, 5);
                        if (isVert) {
                            q = `What transformation maps y = f(x) onto y = ${factor}f(x)?`;
                            correct = `Vertical stretch by a scale factor of ${factor}`;
                            options = [correct, `Horizontal stretch by a scale factor of ${factor}`, `Vertical translation by ${factor}`, `Horizontal stretch by a scale factor of 1/${factor}`];
                            exp = `Multiplying f(x) by a constant 'a' results in a vertical stretch by scale factor 'a'.`;
                        } else {
                            q = `What transformation maps y = f(x) onto y = f(${factor}x)?`;
                            correct = `Horizontal stretch by a scale factor of 1/${factor}`;
                            options = [correct, `Horizontal stretch by a scale factor of ${factor}`, `Vertical stretch by a scale factor of ${factor}`, `Vertical stretch by a scale factor of 1/${factor}`];
                            exp = `Multiplying x by 'b' inside f(bx) results in a horizontal stretch by scale factor 1/b. Here b = ${factor}, so scale factor is 1/${factor}.`;
                        }
                    } else if (level === 2) {
                        const a = rInt(2, 4);
                        const b = rInt(2, 4);
                        q = `The point (12, 6) lies on y = f(x). Find its image on y = ${a}f(${b}x).`;
                        correct = `(${12 / b}, ${6 * a})`;
                        options = [correct, `(${12 * b}, ${6 * a})`, `(${12 / b}, ${6 / a})`, `(${12 * b}, ${6 / a})`];
                        exp = `y = a f(bx) applies a horizontal stretch by factor 1/b (x ÷ ${b}) and vertical stretch by factor a (y × ${a}). (12/${b}, 6×${a}) = ${correct}.`;
                    } else {
                        const a = rInt(2, 4);
                        q = `The domain of f(x) is [-6, 6] and its range is [0, 10]. What is the domain and range of g(x) = ${a}f(x/${a})?`;
                        correct = `Domain: [-${6 * a}, ${6 * a}], Range: [0, ${10 * a}]`;
                        options = [
                            correct,
                            `Domain: [-${6 / a}, ${6 / a}], Range: [0, ${10 * a}]`,
                            `Domain: [-${6 * a}, ${6 * a}], Range: [0, ${10 / a}]`,
                            `Domain: [-${6 / a}, ${6 / a}], Range: [0, ${10 / a}]`
                        ];
                        exp = `g(x) = a f(x/a). Horizontal stretch factor is 'a', stretching domain [-6, 6] to [-${6 * a}, ${6 * a}]. Vertical stretch factor is 'a', stretching range [0, 10] to [0, ${10 * a}].`;
                    }
                } else {
                    // SPECIFIC DILATION QUESTIONS
                    if (level === 1) {
                        q = `What equation is formed when y = sin(x) undergoes a horizontal compression by factor 2 (horizontal stretch by scale factor 1/2)?`;
                        correct = `y = sin(2x)`;
                        options = [`y = sin(2x)`, `y = sin(x/2)`, `y = 2 sin(x)`, `y = 0.5 sin(x)`];
                        exp = `A horizontal stretch by scale factor 1/b corresponds to replacing x with bx. For factor 1/2, b = 2, yielding y = sin(2x).`;
                    } else if (level === 2) {
                        q = `The period of y = cos(x) is 2π. What is the period of y = cos(4x)?`;
                        correct = `π/2`;
                        options = [`π/2`, `8π`, `2π`, `4π`];
                        exp = `For y = cos(bx), the period is Period = 2π / b. Here b = 4, so Period = 2π/4 = π/2.`;
                    } else {
                        q = `If f(x) = x² - 4 has x-intercepts at x = -2 and x = 2, what are the x-intercepts of g(x) = f(2x) = (2x)² - 4?`;
                        correct = `x = -1 and x = 1`;
                        options = [`x = -1 and x = 1`, `x = -4 and x = 4`, `x = -2 and x = 2`, `x = -0.5 and x = 0.5`];
                        exp = `f(2x) applies a horizontal stretch by scale factor 1/2. The original x-intercepts ±2 are multiplied by 1/2 to give x = ±1.`;
                    }
                }
            } else {
                // COMBINED TRANSFORMATIONS
                if (!isSpecific) {
                    if (level === 1) {
                        const c = rInt(1, 4);
                        const d = rInt(1, 4);
                        q = `Describe the transformations to get from y = f(x) to y = -f(x + ${c}) + ${d}.`;
                        correct = `Translate left ${c}, reflect in x-axis, translate up ${d}`;
                        options = [
                            correct,
                            `Translate right ${c}, reflect in x-axis, translate up ${d}`,
                            `Translate left ${c}, reflect in y-axis, translate up ${d}`,
                            `Translate left ${c}, reflect in x-axis, translate down ${d}`
                        ];
                        exp = `Order of operations: 1. Inside bracket (x + ${c}) -> left ${c}. 2. Outer minus sign -> reflect in x-axis. 3. +${d} outside -> translate up ${d}.`;
                    } else if (level === 2) {
                        const a = rInt(2, 3);
                        const c = rInt(1, 3);
                        q = `Point (2, 5) lies on f(x). It undergoes a horizontal shift right by ${c}, followed by a vertical stretch by factor ${a}. Find the new coordinates.`;
                        correct = `(${2 + c}, ${5 * a})`;
                        options = [correct, `(${2 - c}, ${5 * a})`, `(${(2 + c) * a}, 5)`, `(${2 + c}, ${5 / a})`];
                        exp = `1. Shift right ${c}: x becomes 2 + ${c}. 2. Vertical stretch ${a}: y becomes 5 × ${a} = ${5 * a}. Final coordinates: (${2 + c}, ${5 * a}).`;
                    } else {
                        q = `Find the equation of the image of y = f(x) after: 1) Translation by vector (1, -2), 2) Reflection in y-axis, 3) Vertical stretch by factor 3.`;
                        correct = `y = 3(f(-x - 1) - 2)`;
                        options = [
                            `y = 3(f(-x - 1) - 2)`,
                            `y = 3f(-x - 1) - 2`,
                            `y = 3(f(-(x - 1)) - 2)`,
                            `y = -3(f(x - 1) - 2)`
                        ];
                        exp = `1) Trans: f(x - 1) - 2. 2) Reflect y-axis (x -> -x): f(-x - 1) - 2. 3) Vert stretch by 3: multiply entire expression by 3 -> 3(f(-x - 1) - 2).`;
                    }
                } else {
                    // SPECIFIC COMBINED
                    if (level === 1) {
                        q = `Describe the sequence of transformations mapping y = sin(x) onto y = 2 sin(x + 2) - 3.`;
                        correct = `Translate left 2, vertical stretch by factor 2, translate down 3`;
                        options = [
                            correct,
                            `Translate right 2, vertical stretch by factor 2, translate down 3`,
                            `Translate left 2, horizontal stretch by factor 2, translate down 3`,
                            `Translate left 2, vertical stretch by factor 2, translate up 3`
                        ];
                        exp = `sin(x + 2) represents a translation 2 units left. Coefficient 2 stretches vertically by factor 2. Constant -3 translates 3 units down.`;
                    } else if (level === 2) {
                        q = `Find the transformed equation when y = eˣ undergoes a translation left by 2 units, reflection in the x-axis, and translation up by 3 units.`;
                        correct = `y = -e^(x + 2) + 3`;
                        options = [`y = -e^(x + 2) + 3`, `y = e^(-x - 2) + 3`, `y = -e^(x - 2) + 3`, `y = e^(-x + 2) - 3`];
                        exp = `1. Translate left 2: e^(x+2). 2. Reflect in x-axis: -e^(x+2). 3. Translate up 3: -e^(x+2) + 3.`;
                    } else {
                        q = `Starting with y = x²: 1) Translate by vector (1, -2), 2) Reflect in y-axis, 3) Vertical stretch by factor 3. What is the expanded equation?`;
                        correct = `y = 3x² + 6x - 3`;
                        options = [`y = 3x² + 6x - 3`, `y = 3x² - 6x - 3`, `y = -3x² + 6x - 3`, `y = 3x² + 6x + 3`];
                        exp = `1. y = (x - 1)² - 2. 2. x -> -x: y = (-x - 1)² - 2 = (x + 1)² - 2 = x² + 2x - 1. 3. Multiply by 3: y = 3(x² + 2x - 1) = 3x² + 6x - 3.`;
                    }
                }
            }

            const finalOptions = shuffle(options);
            const correctIdx = finalOptions.indexOf(correct);

            return { q, options: finalOptions, ans: correctIdx, exp, isSpecific };
        };

        // --- MAIN COMPONENT ---
        function FunctionTransformations() {
            const [activeTab, setActiveTab] = useState('explore');
            const [exploreTopic, setExploreTopic] = useState('translation');
            const [funcKey, setFuncKey] = useState('quadratic');
            
            // Transformation Parameters: y = a * f(b(x - c)) + d
            const [params, setParams] = useState({ a: 1, b: 1, c: 0, d: 0 });

            // Quiz State
            const [quizTopic, setQuizTopic] = useState('translation');
            const [quizLevel, setQuizLevel] = useState(1);
            const [quizScore, setQuizScore] = useState(0); 
            const [currentQ, setCurrentQ] = useState(null);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [showExp, setShowExp] = useState(false);
            const [levelComplete, setLevelComplete] = useState(false);

            // Graph state for dragging
            const svgRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0, c: 0, d: 0 });

            // Generate a question when needed
            useEffect(() => {
                if (activeTab === 'quiz' && !currentQ && !levelComplete) {
                    setCurrentQ(generateQuestion(quizTopic, quizLevel, quizScore));
                }
            }, [activeTab, quizTopic, quizLevel, quizScore, currentQ, levelComplete]);

            const resetParams = () => setParams({ a: 1, b: 1, c: 0, d: 0 });

            // Handlers for Explore Mode
            const handleTopicChange = (topic) => {
                setExploreTopic(topic);
                resetParams();
            };

            // SVG Coordinates mapping
            const graphSize = 500;
            const domain = [-10, 10];
            const range = [-10, 10];
            const mapX = (x) => ((x - domain[0]) / (domain[1] - domain[0])) * graphSize;
            const mapY = (y) => graphSize - ((y - range[0]) / (range[1] - range[0])) * graphSize;
            const unmapX = (svgX) => domain[0] + (svgX / graphSize) * (domain[1] - domain[0]);
            const unmapY = (svgY) => range[0] + ((graphSize - svgY) / graphSize) * (range[1] - range[0]);

            // Drag Handlers
            const handleMouseDown = (e) => {
                if (exploreTopic === 'reflection' || exploreTopic === 'dilation') return;
                if (!svgRef.current) return;
                
                const rect = svgRef.current.getBoundingClientRect();
                const svgX = e.clientX - rect.left;
                const svgY = e.clientY - rect.top;
                setIsDragging(true);
                setDragStart({ x: unmapX(svgX), y: unmapY(svgY), c: params.c, d: params.d });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                if (!svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                const svgX = e.clientX - rect.left;
                const svgY = e.clientY - rect.top;
                const currentX = unmapX(svgX);
                const currentY = unmapY(svgY);
                
                const deltaX = currentX - dragStart.x;
                const deltaY = currentY - dragStart.y;
                
                const newC = Math.round((dragStart.c + deltaX) * 2) / 2;
                const newD = Math.round((dragStart.d + deltaY) * 2) / 2;

                setParams(p => ({ ...p, c: newC, d: newD }));
            };

            const handleMouseUp = () => setIsDragging(false);

            // Generate paths for graphs
            const currentFunc = FUNCTIONS[funcKey];
            const generatePath = (isTransformed) => {
                let path = '';
                const step = 0.1;
                let isFirst = true;
                for (let x = domain[0]; x <= domain[1]; x += step) {
                    let y;
                    if (!isTransformed) {
                        y = currentFunc.eval(x);
                    } else {
                        const innerX = params.b * (x - params.c);
                        y = params.a * currentFunc.eval(innerX) + params.d;
                    }
                    
                    if (y > range[1] * 2 || y < range[0] * 2 || isNaN(y)) {
                        isFirst = true;
                        continue;
                    }

                    const svgX = mapX(x);
                    const svgY = mapY(y);
                    if (isFirst) {
                        path += `M ${svgX} ${svgY} `;
                        isFirst = false;
                    } else {
                        path += `L ${svgX} ${svgY} `;
                    }
                }
                return path;
            };

            const parentPath = useMemo(() => generatePath(false), [funcKey]);
            const transformedPath = useMemo(() => generatePath(true), [funcKey, params]);

            // Quiz Handlers
            const handleQuizAnswer = (idx) => {
                if (showExp) return;
                setSelectedOpt(idx);
                setShowExp(true);
                if (idx === currentQ.ans) {
                    const newScore = quizScore + 1;
                    if (newScore >= 5) {
                        setLevelComplete(true);
                    } else {
                        setQuizScore(newScore);
                    }
                } else {
                    setQuizScore(0);
                }
            };

            const nextQuestion = () => {
                setSelectedOpt(null);
                setShowExp(false);
                setCurrentQ(null); 
            };

            const nextLevel = () => {
                if (quizLevel < 3) {
                    setQuizLevel(quizLevel + 1);
                } else {
                    setQuizTopic(quizTopic === 'translation' ? 'reflection' : quizTopic === 'reflection' ? 'dilation' : 'combined');
                    setQuizLevel(1);
                }
                setQuizScore(0);
                setLevelComplete(false);
                nextQuestion();
            };

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-800">
                
                {/* SIDEBAR */}
                <div className="w-80 bg-white shadow-xl flex flex-col z-10 border-r border-slate-200">
                    <div className="p-6 bg-indigo-600 text-white shadow-md">
                    <h1 className="text-2xl font-bold tracking-tight mb-1">Function Transform</h1>
                    <p className="text-indigo-200 text-sm">IBDP Mathematics AA/AI</p>
                    </div>

                    <div className="flex-1 overflow-y-auto">
                    {/* Main Navigation Tabs */}
                    <div className="flex w-full border-b border-slate-200 bg-slate-50">
                        <button 
                        onClick={() => setActiveTab('explore')}
                        className={`flex-1 py-3 text-sm font-medium transition-colors ${activeTab === 'explore' ? 'bg-white border-t-2 border-t-indigo-600 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'}`}
                        >
                        Explore
                        </button>
                        <button 
                        onClick={() => setActiveTab('quiz')}
                        className={`flex-1 py-3 text-sm font-medium transition-colors ${activeTab === 'quiz' ? 'bg-white border-t-2 border-t-indigo-600 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'}`}
                        >
                        Quiz Mode
                        </button>
                    </div>

                    {activeTab === 'explore' && (
                        <div className="p-6 space-y-6">
                        
                        {/* Function Selection */}
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Parent Function</label>
                            <select 
                            className="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5"
                            value={funcKey}
                            onChange={(e) => setFuncKey(e.target.value)}
                            >
                            {Object.entries(FUNCTIONS).map(([key, f]) => (
                                <option key={key} value={key}>{f.label}</option>
                            ))}
                            </select>
                        </div>

                        {/* Transformation Category */}
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Transformation Type</label>
                            <div className="space-y-2">
                            {['translation', 'reflection', 'dilation', 'combined'].map(t => (
                                <button
                                key={t}
                                onClick={() => handleTopicChange(t)}
                                className={`w-full text-left px-4 py-2 rounded-lg border transition-all ${exploreTopic === t ? 'bg-indigo-50 border-indigo-200 text-indigo-700 font-medium' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50'}`}
                                >
                                {t.charAt(0).toUpperCase() + t.slice(1)}
                                </button>
                            ))}
                            </div>
                        </div>

                        <hr className="border-slate-200" />

                        {/* Controls */}
                        <div className="space-y-5">
                            <div className="flex justify-between items-center">
                            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Parameters</label>
                            <button onClick={resetParams} className="text-xs text-indigo-600 hover:text-indigo-800 flex items-center gap-1 font-medium bg-indigo-50 px-2 py-1 rounded">
                                <RotateCcw size={12} /> Reset
                            </button>
                            </div>

                            {(exploreTopic === 'translation' || exploreTopic === 'combined') && (
                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-4">
                                <div>
                                <div className="flex justify-between mb-1">
                                    <span className="text-sm font-medium text-slate-700">Horiz. Translation (c)</span>
                                    <span className="text-sm font-bold text-indigo-600">{params.c}</span>
                                </div>
                                <input type="range" min="-10" max="10" step="0.5" value={params.c} onChange={(e) => setParams({...params, c: parseFloat(e.target.value)})} className="w-full accent-indigo-600" />
                                </div>
                                <div>
                                <div className="flex justify-between mb-1">
                                    <span className="text-sm font-medium text-slate-700">Vert. Translation (d)</span>
                                    <span className="text-sm font-bold text-indigo-600">{params.d}</span>
                                </div>
                                <input type="range" min="-10" max="10" step="0.5" value={params.d} onChange={(e) => setParams({...params, d: parseFloat(e.target.value)})} className="w-full accent-indigo-600" />
                                </div>
                                <p className="text-xs text-slate-500 italic flex gap-1 items-center bg-white p-2 rounded border border-slate-200">
                                <Activity size={12} className="text-indigo-400"/>
                                Tip: You can also drag the graph to translate!
                                </p>
                            </div>
                            )}

                            {(exploreTopic === 'dilation' || exploreTopic === 'combined') && (
                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-4">
                                <div>
                                <div className="flex justify-between mb-1">
                                    <span className="text-sm font-medium text-slate-700">Vert. Scale (a)</span>
                                    <span className="text-sm font-bold text-emerald-600">{params.a}</span>
                                </div>
                                <input type="range" min="-5" max="5" step="0.5" value={params.a} onChange={(e) => {const v = parseFloat(e.target.value); setParams({...params, a: v === 0 ? 0.5 : v})}} className="w-full accent-emerald-600" />
                                </div>
                                <div>
                                <div className="flex justify-between mb-1">
                                    <span className="text-sm font-medium text-slate-700">Horiz. Scale (1/b)</span>
                                    <span className="text-sm font-bold text-emerald-600">b = {params.b}</span>
                                </div>
                                <input type="range" min="-5" max="5" step="0.5" value={params.b} onChange={(e) => {const v = parseFloat(e.target.value); setParams({...params, b: v === 0 ? 0.5 : v})}} className="w-full accent-emerald-600" />
                                </div>
                            </div>
                            )}

                            {(exploreTopic === 'reflection') && (
                            <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                                <button 
                                onClick={() => setParams(p => ({...p, a: p.a === 1 ? -1 : 1}))}
                                className={`w-full py-2 px-4 rounded-lg font-medium text-sm transition-colors border ${params.a === -1 ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}
                                >
                                Reflect x-axis: y = -f(x)
                                </button>
                                <button 
                                onClick={() => setParams(p => ({...p, b: p.b === 1 ? -1 : 1}))}
                                className={`w-full py-2 px-4 rounded-lg font-medium text-sm transition-colors border ${params.b === -1 ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}
                                >
                                Reflect y-axis: y = f(-x)
                                </button>
                            </div>
                            )}

                        </div>
                        </div>
                    )}

                    {activeTab === 'quiz' && (
                        <div className="p-6 space-y-6">
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Quiz Topic</label>
                            <select 
                            className="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2.5 mb-4"
                            value={quizTopic}
                            onChange={(e) => { setQuizTopic(e.target.value); setQuizLevel(1); setQuizScore(0); setShowExp(false); setCurrentQ(null); setLevelComplete(false); }}
                            >
                            <option value="translation">Translation</option>
                            <option value="reflection">Reflection</option>
                            <option value="dilation">Dilation</option>
                            <option value="combined">Combined Transformations</option>
                            </select>

                            <div className="flex gap-2">
                            {[1, 2, 3].map(lvl => (
                                <div key={lvl} className={`flex-1 py-2 text-center text-xs font-bold rounded-md border ${quizLevel === lvl ? 'bg-indigo-600 text-white border-indigo-700 shadow-inner' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
                                Level {lvl}
                                </div>
                            ))}
                            </div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center space-y-3">
                            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest block">Progress (5 Streak to Pass)</span>
                            <div className="flex justify-center gap-2">
                            {[...Array(5)].map((_, i) => (
                                <div key={i} className={`w-7 h-7 rounded-full flex items-center justify-center border-2 text-xs font-bold ${i < quizScore ? 'bg-emerald-500 border-emerald-600 text-white' : 'bg-slate-100 border-slate-200 text-slate-400'}`}>
                                {i < quizScore ? <CheckCircle2 size={16} /> : (i + 1)}
                                </div>
                            ))}
                            </div>
                            <div className="bg-slate-50 p-2 rounded text-xs text-slate-600 border border-slate-100">
                                {quizScore < 3 ? 'Questions 1–3: Notation f(x)' : 'Questions 4–5: Specific Functions (e.g. sin, x², eˣ)'}
                            </div>
                        </div>
                        </div>
                    )}
                    </div>
                </div>

                {/* MAIN CONTENT AREA */}
                <div className="flex-1 flex flex-col bg-slate-100 overflow-y-auto relative p-6 sm:p-8">
                    
                    {activeTab === 'explore' ? (
                    <div className="flex-1 flex flex-col xl:flex-row gap-8 items-center xl:items-start justify-center w-full max-w-6xl mx-auto pb-10">
                        
                        {/* GRAPH CONTAINER */}
                        <div 
                        ref={svgRef}
                        className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 relative select-none shrink-0"
                        style={{ width: graphSize, height: graphSize, cursor: (exploreTopic === 'translation' || exploreTopic === 'combined') ? (isDragging ? 'grabbing' : 'grab') : 'default' }}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        >
                        <svg width={graphSize} height={graphSize} className="absolute top-0 left-0 pointer-events-none">
                            {/* Grid */}
                            {[...Array(21)].map((_, i) => {
                            const pos = (i * graphSize) / 20;
                            return (
                                <React.Fragment key={i}>
                                <line x1={pos} y1={0} x2={pos} y2={graphSize} stroke={i === 10 ? '#94a3b8' : '#e2e8f0'} strokeWidth={i === 10 ? 2 : 1} />
                                <line x1={0} y1={pos} x2={graphSize} y2={pos} stroke={i === 10 ? '#94a3b8' : '#e2e8f0'} strokeWidth={i === 10 ? 2 : 1} />
                                </React.Fragment>
                            );
                            })}
                            
                            {/* Parent Graph */}
                            <path d={parentPath} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                            
                            {/* Transformed Graph */}
                            <path d={transformedPath} fill="none" stroke="#4f46e5" strokeWidth="3" />

                            {/* Parent Points & Transformed Points */}
                            {currentFunc.points.map((pt, i) => {
                            const sx = mapX(pt.x);
                            const sy = mapY(pt.y);
                            
                            // Transformed coords
                            const newX = pt.x / params.b + params.c;
                            const newY = params.a * pt.y + params.d;
                            const nsx = mapX(newX);
                            const nsy = mapY(newY);
                            
                            const fx = (val) => Number.isInteger(val) ? val : val.toFixed(1);

                            return (
                                <React.Fragment key={i}>
                                {/* Connecting Line */}
                                <line x1={sx} y1={sy} x2={nsx} y2={nsy} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3,3" />

                                {/* Parent Point & Label */}
                                <circle cx={sx} cy={sy} r="4" fill="#94a3b8" />
                                <rect x={sx + 6} y={sy - 16} width="70" height="18" fill="white" fillOpacity="0.85" rx="2" />
                                <text x={sx + 8} y={sy - 3} fill="#64748b" fontSize="11" fontWeight="bold">
                                    {pt.label}({fx(pt.x)}, {fx(pt.y)})
                                </text>
                                
                                {/* Transformed Point & Label */}
                                <circle cx={nsx} cy={nsy} r="5" fill="#4f46e5" />
                                <rect x={nsx + 8} y={nsy - 18} width="75" height="18" fill="white" fillOpacity="0.85" rx="2" />
                                <text x={nsx + 10} y={nsy - 5} fill="#4338ca" fontSize="11" fontWeight="bold">
                                    {pt.label}'({fx(newX)}, {fx(newY)})
                                </text>
                                </React.Fragment>
                            );
                            })}
                        </svg>
                        </div>

                        {/* EQUATION & COORDINATES INFO PANEL */}
                        <div className="flex-1 bg-white p-6 rounded-2xl shadow-xl border border-slate-200 min-w-[320px] max-w-md w-full h-fit">
                        
                        <h3 className="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Function Equation</h3>
                        
                        <div className="mb-6 space-y-3">
                            <div className="p-4 bg-slate-50 rounded-lg border border-slate-200 text-center shadow-sm">
                            <span className="text-xs text-slate-500 font-bold uppercase tracking-wide block mb-2">Parent Function f(x)</span>
                            <span className="text-xl font-mono text-slate-700">y = {currentFunc.str}</span>
                            </div>
                            
                            <div className="flex justify-center text-slate-400 py-1">
                            <ArrowRight size={18} />
                            </div>

                            <div className="p-5 bg-indigo-50/70 rounded-lg border border-indigo-100 border-l-4 border-l-indigo-500 text-center shadow-sm">
                            <span className="text-xs text-indigo-600 font-bold uppercase tracking-wide block mb-3">Transformed Function g(x)</span>
                            <span className="text-lg sm:text-xl font-mono text-indigo-800 font-semibold block leading-relaxed break-words">
                                y = {params.a !== 1 ? (params.a === -1 ? '-' : params.a) : ''} 
                                f({params.b !== 1 ? (params.b === -1 ? '-' : params.b) : ''}
                                {params.c !== 0 ? `(x ${params.c > 0 ? '-' : '+'} ${Math.abs(params.c)})` : 'x'}) 
                                {params.d !== 0 ? ` ${params.d > 0 ? '+' : '-'} ${Math.abs(params.d)}` : ''}
                            </span>
                            </div>
                        </div>

                        <h3 className="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Coordinate Mapping</h3>
                        <div className="space-y-3">
                            {currentFunc.points.map((pt, i) => {
                            const newX = pt.x / params.b + params.c;
                            const newY = params.a * pt.y + params.d;
                            const fx = (val) => Number.isInteger(val) ? val : val.toFixed(2);

                            return (
                                <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-100 hover:border-indigo-200 transition-colors">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm">
                                    {pt.label}
                                    </div>
                                    <span className="font-mono text-sm text-slate-600">({fx(pt.x)}, {fx(pt.y)})</span>
                                </div>
                                <ArrowRight size={16} className="text-slate-400" />
                                <div className="flex items-center gap-3">
                                    <span className="font-mono text-sm font-bold text-indigo-700">({fx(newX)}, {fx(newY)})</span>
                                    <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm">
                                    {pt.label}'
                                    </div>
                                </div>
                                </div>
                            )
                            })}
                        </div>
                        </div>

                    </div>
                    ) : (
                    <div className="flex-1 flex flex-col items-center justify-center bg-gradient-to-br from-slate-100 to-indigo-50/50 w-full h-full rounded-2xl min-h-[500px]">
                        {levelComplete ? (
                        <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-md w-full text-center">
                            <div className="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                            <Trophy size={48} />
                            </div>
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Level Conquered!</h2>
                            <p className="text-slate-600 mb-8">Outstanding achievement! You've mastered {quizTopic} at Level {quizLevel}. You are analyzing both abstract notation and specific algebraic functions like an IB Scholar.</p>
                            <button 
                            onClick={nextLevel}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2"
                            >
                            {quizLevel < 3 ? 'Proceed to Next Level' : 'Choose Next Topic'} <ChevronRight size={20} />
                            </button>
                        </div>
                        ) : currentQ ? (
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-2xl w-full border border-slate-100">
                            <div className="flex justify-between items-center mb-6 gap-2 flex-wrap">
                            <div className="flex items-center gap-2">
                                <span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    {quizTopic} • Level {quizLevel}
                                </span>
                                <span className={`text-xs font-semibold px-2.5 py-1 rounded-full ${currentQ.isSpecific ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-sky-100 text-sky-800 border border-sky-200'}`}>
                                    {currentQ.isSpecific ? 'Specific Function (e.g. sin, x², eˣ)' : 'Abstract Notation f(x)'}
                                </span>
                            </div>
                            <span className="text-sm font-medium text-slate-500">Question {quizScore + 1} of 5</span>
                            </div>
                            
                            <h2 className="text-xl font-medium text-slate-800 mb-8 leading-relaxed">
                            {currentQ.q}
                            </h2>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                            {currentQ.options.map((opt, idx) => {
                                let btnClass = "p-4 rounded-xl border-2 text-left font-mono text-sm transition-all ";
                                if (showExp) {
                                if (idx === currentQ.ans) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800";
                                else if (idx === selectedOpt) btnClass += "bg-rose-50 border-rose-500 text-rose-800";
                                else btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                } else {
                                btnClass += selectedOpt === idx ? "border-indigo-500 bg-indigo-50" : "bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700";
                                }

                                return (
                                <button 
                                    key={idx} 
                                    disabled={showExp}
                                    onClick={() => handleQuizAnswer(idx)}
                                    className={btnClass}
                                >
                                    <div className="flex items-center gap-3">
                                    <span className={`w-6 h-6 rounded flex items-center justify-center text-xs font-bold shrink-0 ${showExp ? (idx === currentQ.ans ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-500') : 'bg-slate-100 text-slate-500'}`}>
                                        {['A', 'B', 'C', 'D'][idx]}
                                    </span>
                                    {opt}
                                    </div>
                                </button>
                                )
                            })}
                            </div>

                            {showExp && (
                            <div className={`p-5 rounded-xl border ${selectedOpt === currentQ.ans ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                <div className="flex items-start gap-4">
                                {selectedOpt === currentQ.ans ? (
                                    <CheckCircle2 className="text-emerald-500 mt-1 shrink-0" size={24} />
                                ) : (
                                    <XCircle className="text-rose-500 mt-1 shrink-0" size={24} />
                                )}
                                <div>
                                    <h4 className={`font-bold mb-1 ${selectedOpt === currentQ.ans ? 'text-emerald-800' : 'text-rose-800'}`}>
                                    {selectedOpt === currentQ.ans ? 'Correct!' : 'Incorrect'}
                                    </h4>
                                    <p className={`text-sm leading-relaxed ${selectedOpt === currentQ.ans ? 'text-emerald-700' : 'text-rose-700'}`}>
                                    {currentQ.exp}
                                    </p>
                                </div>
                                </div>
                                
                                <div className="mt-6 flex justify-end">
                                <button 
                                    onClick={nextQuestion}
                                    className="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2"
                                >
                                    Next Question <ArrowRight size={16} />
                                </button>
                                </div>
                            </div>
                            )}
                        </div>
                        ) : null}
                    </div>
                    )}
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FunctionTransformations />);
    </script>
</body>
</html>
