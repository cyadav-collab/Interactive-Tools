<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBDP Mathematics Hub | Chandrabhan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc; /* Light background */
            color: #0f172a; /* Dark text */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            position: relative;
            z-index: 1;
            /* Vibrant glowing background + Dark Math grid */
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(56, 189, 248, 0.2) 0%, transparent 50%),
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
        }

        /* Floating Math Symbols Background */
        .math-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .math-symbol {
            position: absolute;
            color: rgba(0, 0, 0, 0.04); /* Faint dark symbols */
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            user-select: none;
            animation: float 15s infinite ease-in-out alternate;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-40px) rotate(15deg); }
        }

        .header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 45px;
            position: relative;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #db2777; /* Darker pink for contrast */
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1);
        }

            font-size: 2.8rem;
